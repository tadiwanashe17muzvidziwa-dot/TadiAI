<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TadiAI</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #082f49;
      --muted: #466b7c;
      --paper: #e6f3f6;
      --panel: #f8fdff;
      --line: #b8d6df;
      --accent: #007c91;
      --accent-dark: #00566b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 95% 10%, #0b3954 0, transparent 30%), linear-gradient(135deg, #e6f3f6, #c9e5eb 55%, #edf9fa), var(--paper);
      color: var(--ink);
      font: 16px/1.5 Georgia, "Times New Roman", serif;
    }
    main { width: min(880px, calc(100% - 32px)); margin: 0 auto; padding: 8vh 0 7vh; }
    .eyebrow { color: var(--accent-dark); font: 700 12px/1.2 Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
    h1 { margin: 8px 0 10px; font-size: clamp(2.6rem, 8vw, 5.8rem); line-height: .95; font-weight: 400; }
    .intro { max-width: 540px; margin: 0 0 36px; color: var(--muted); font-size: 1.15rem; }
    .chat { overflow: hidden; border: 1px solid var(--line); background: var(--panel); box-shadow: 14px 14px 0 #a9cbd5; }
    .messages { min-height: 280px; max-height: 52vh; overflow-y: auto; padding: 24px; }
    .message { max-width: 78%; margin: 0 0 18px; padding: 14px 16px; white-space: pre-wrap; }
    .message.user { margin-left: auto; background: #c7e7ed; }
    .message.assistant { border-left: 3px solid var(--accent); background: #eef9fb; }
    .message-label { display: block; margin-bottom: 4px; color: var(--muted); font: 700 11px Arial, sans-serif; letter-spacing: 1px; text-transform: uppercase; }
    form { display: flex; gap: 12px; border-top: 1px solid var(--line); padding: 20px; }
    textarea { flex: 0 1 620px; width: 100%; min-height: 52px; max-height: 140px; resize: vertical; border: 1px solid var(--line); padding: 10px 12px; color: var(--ink); background: #fff; font: inherit; }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    #send { align-self: center; width: 56px; height: 36px; border: 0; border-radius: 65% 35% 35% 65% / 55% 45% 45% 55%; padding: 0; background: var(--accent); transform: rotate(-14deg); cursor: pointer; }
    #send::after { display: block; width: 0; height: 0; margin: 0 auto; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 11px solid #fff; content: ""; transform: rotate(14deg); }
    #send:hover { background: var(--accent-dark); }
    #send:disabled { cursor: wait; opacity: .6; }
    .emoji-tools { position: relative; align-self: center; }
    .emoji-toggle, .emoji-button { border: 1px solid var(--line); background: #fff; cursor: pointer; }
    .emoji-toggle { width: 42px; height: 42px; padding: 0; font-size: 20px; }
    .emoji-toggle:hover, .emoji-button:hover { border-color: var(--accent); background: #e6f5f7; }
    .emoji-picker { position: absolute; right: 0; bottom: 50px; z-index: 2; display: none; width: 220px; max-height: 320px; overflow-y: auto; padding: 10px; border: 1px solid var(--line); background: var(--panel); box-shadow: 6px 6px 0 #a9cbd5; }
    .emoji-picker.open { display: grid; }
    .emoji-group { display: grid; grid-template-columns: repeat(5, 36px); gap: 4px; margin-bottom: 10px; }
    .emoji-group:last-child { margin-bottom: 0; }
    .emoji-button { width: 36px; height: 36px; padding: 0; font-size: 19px; }
    .status { min-height: 24px; margin-top: 16px; color: var(--muted); font: 13px Arial, sans-serif; }
    @media (max-width: 560px) {
      main { padding-top: 12vw; }
      .chat { box-shadow: 8px 8px 0 #a9cbd5; }
      .messages { min-height: 240px; padding: 16px; }
      .message { max-width: 92%; }
      form { flex-direction: column; }
      textarea { flex-basis: auto; }
      #send { align-self: flex-end; width: 58px; height: 36px; }
      .emoji-tools { align-self: flex-end; }
      .emoji-picker { right: 0; bottom: 48px; }
    }
  </style>
</head>

  <script>
    const form = document.querySelector('#chat-form');
    const input = document.querySelector('#message');
    const messages = document.querySelector('#messages');
    const send = document.querySelector('#send');
    const status = document.querySelector('#status');
    const emojiToggle = document.querySelector('#emoji-toggle');
    const emojiPicker = document.querySelector('#emoji-picker');
    const conversationHistory = [];

    emojiToggle.addEventListener('click', () => {
      emojiPicker.classList.toggle('open');
    });

    emojiPicker.addEventListener('click', (event) => {
      const emojiButton = event.target.closest('.emoji-button');
      if (!emojiButton) return;

      const start = input.selectionStart;
      const end = input.selectionEnd;
      input.value = input.value.slice(0, start) + emojiButton.textContent + input.value.slice(end);
      input.focus();
      input.setSelectionRange(start + emojiButton.textContent.length, start + emojiButton.textContent.length);
      emojiPicker.classList.remove('open');
    });

    function addMessage(label, text, kind) {
      const element = document.createElement('div');
      element.className = `message ${kind}`;
      const labelElement = document.createElement('span');
      labelElement.className = 'message-label';
      labelElement.textContent = label;
      element.append(labelElement, document.createTextNode(text));
      messages.appendChild(element);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage('You', message, 'user');
      input.value = '';
      send.disabled = true;
      status.textContent = 'Thinking...';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, history: conversationHistory.slice(-20) })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Request failed.');
        addMessage('TadiAI', data.response, 'assistant');
        conversationHistory.push(
          { role: 'user', text: message },
          { role: 'model', text: data.response }
        );
        status.textContent = '';
      } catch (error) {
        status.textContent = error.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
